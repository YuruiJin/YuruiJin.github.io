name: Compile and deploy bilingual resume PDFs

on:
  push:
    branches:
      - main
    paths:
      - "resume/**"
      - ".github/workflows/compile-resume.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  compile-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile English resume (pdflatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV_Jin_Yurui.tex
          working_directory: resume/en

      - name: Compile Chinese resume (xelatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV_Jin_Yurui.tex
          working_directory: resume/zh

      - name: Copy PDFs to language-specific assets paths
        run: |
          mkdir -p assets/pdf/en-us assets/pdf/zh-cn
          cp resume/en/CV_Jin_Yurui.pdf assets/pdf/en-us/CV_Jin_Yurui.pdf
          cp resume/zh/CV_Jin_Yurui.pdf assets/pdf/zh-cn/CV_Jin_Yurui.pdf

      - name: Commit and push generated PDFs
        id: commit_pdfs
        run: |
          git add assets/pdf/en-us/CV_Jin_Yurui.pdf assets/pdf/zh-cn/CV_Jin_Yurui.pdf

          if git diff --cached --quiet -- assets/pdf/en-us/CV_Jin_Yurui.pdf assets/pdf/zh-cn/CV_Jin_Yurui.pdf; then
            echo "No generated PDF changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update compiled bilingual resume PDFs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site deployment
        if: steps.commit_pdfs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
